<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zymoscope</title>
<script src="/static/chart.min.js"></script>
<style>
  :root {
    --bg:       #121218;
    --surface:  #1c1c26;
    --surface2: #23232f;
    --border:   #2a2a3a;
    --text:     #e0e0e8;
    --dim:      #888898;
    --accent:   #f0a020;
    --heat:     #e05040;
    --cool:     #40a0e0;
    --green:    #40c060;
    --radius:   8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  a { color: inherit; }
  button { font: inherit; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: .9rem 1.5rem; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 1.35rem; color: var(--accent); letter-spacing: .02em; }
  header .status { font-size: .8rem; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--heat); }
  .dot.ok { background: var(--green); }

  .layout {
    display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1rem;
    padding: 1rem 1.5rem; max-width: 1400px; margin: 0 auto;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 1rem; }
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.1rem 1.2rem;
  }
  .devices { display: grid; gap: 1rem; align-content: start; }
  .no-devices { text-align: center; color: var(--dim); padding: 3rem 1rem; }

  /* --- Device card header --- */
  .dev-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .8rem; margin-bottom: .8rem; }
  .dev-name { display: flex; align-items: baseline; gap: .4rem; min-width: 0; }
  .dev-name h2 { font-size: 1.1rem; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev-name input {
    font-size: 1.05rem; font-weight: 600; background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px; width: 14rem; max-width: 100%;
  }
  .icon-btn {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: .8rem; padding: 2px 4px; border-radius: 4px;
  }
  .icon-btn:hover { color: var(--text); background: var(--surface2); }
  .dev-id { font-size: .7rem; color: var(--dim); font-family: ui-monospace, monospace; }
  .dev-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .pill {
    font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--dim);
  }
  .pill.heating { background: rgba(240,160,32,.18); color: var(--accent); }
  .pill.cooling { background: rgba(64,160,224,.18); color: var(--cool); }
  .pill.holding { background: rgba(64,192,96,.15); color: var(--green); }
  .pill.fault, .pill.offline { background: rgba(224,80,64,.18); color: var(--heat); }
  .small-dim { font-size: .7rem; color: var(--dim); }
  .oled-ctl { display: flex; gap: 2px; align-items: center; }
  .oled-ctl .icon-btn { font-size: .7rem; }
  .oled-ctl .pet { filter: grayscale(1); opacity: .45; }
  .oled-ctl .pet:hover { filter: none; opacity: 1; }

  .banner {
    display: none; font-size: .8rem; padding: .5rem .7rem; border-radius: 6px;
    margin-bottom: .8rem; background: rgba(224,80,64,.12); color: #f0a090;
    border: 1px solid rgba(224,80,64,.35);
  }
  .banner.show { display: block; }

  /* --- Readout row --- */
  .readout { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-bottom: .8rem; }
  .tile { background: var(--surface2); border-radius: 6px; padding: .6rem .8rem; }
  .tile .lbl { font-size: .68rem; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .tile .big { font-size: 2.1rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile .big .u { font-size: .9rem; color: var(--dim); font-weight: 500; margin-left: 2px; }
  .tile.temp .big { color: var(--heat); }
  .card.offline .tile.temp .big { color: var(--dim); }
  .delta { font-size: .75rem; color: var(--dim); margin-top: 2px; }
  .target-row { display: flex; align-items: center; gap: .35rem; margin-top: .15rem; }
  .target-row button.step {
    width: 2rem; height: 2rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 1.1rem; cursor: pointer;
  }
  .target-row button.step:hover { border-color: var(--accent); }
  .target-row input {
    width: 4.6rem; text-align: center; font-size: 1.5rem; font-weight: 700;
    background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 6px;
    font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .target-row input::-webkit-outer-spin-button,
  .target-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .target-row input:focus { border-color: var(--border); outline: none; background: var(--bg); }
  .target-row .u { color: var(--dim); font-size: .85rem; }
  .btn {
    background: var(--accent); color: #000; border: none; padding: .4rem .9rem;
    border-radius: 6px; cursor: pointer; font-size: .82rem; font-weight: 650;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); }
  .btn.ghost:hover { color: var(--text); }
  .btn[hidden] { display: none; }

  .batch-line {
    display: none; align-items: center; justify-content: space-between; gap: .6rem;
    font-size: .8rem; padding: .45rem .7rem; margin-bottom: .8rem; border-radius: 6px;
    background: rgba(64,192,96,.08); border: 1px solid rgba(64,192,96,.25);
  }
  .batch-line.show { display: flex; }
  .batch-line a { text-decoration: none; font-weight: 600; }
  .batch-line a:hover { text-decoration: underline; }

  /* --- Range stats + controls --- */
  .stats { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: .78rem; color: var(--dim); margin-bottom: .6rem; }
  .stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; margin-bottom: .5rem; }
  .toolbar .seg { display: flex; gap: .25rem; flex-wrap: wrap; }
  .toolbar button, .toolbar a.tool {
    background: var(--bg); color: var(--dim); border: 1px solid var(--border);
    padding: .25rem .55rem; border-radius: 4px; cursor: pointer;
    font-size: .72rem; font-weight: 600; text-decoration: none;
  }
  .toolbar button:hover, .toolbar a.tool:hover { color: var(--text); }
  .toolbar button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .toolbar .spacer { flex: 1; }
  .chart-wrap { position: relative; height: 230px; }
  .chart-wrap.full { height: 440px; }
  .chart-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: .85rem; pointer-events: none;
  }

  /* --- Sidebar --- */
  .sidebar { display: grid; gap: 1rem; align-content: start; }
  .sidebar h3 { font-size: .9rem; margin-bottom: .6rem; color: var(--accent); }
  .plug-card { border-top: 1px solid var(--border); padding: .6rem 0; }
  .plug-card:first-of-type { border-top: none; padding-top: 0; }
  .plug-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: .3rem; }
  .plug-title h4 { font-size: .85rem; }
  .plug-row { display: flex; justify-content: space-between; font-size: .78rem; padding: .1rem 0; }
  .plug-row .lbl { color: var(--dim); }
  .plug-row .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .plug-toggle {
    border: none; padding: .25rem .7rem; border-radius: 999px; cursor: pointer;
    font-size: .72rem; font-weight: 700; background: var(--surface2); color: var(--dim);
  }
  .plug-toggle.on { background: var(--green); color: #000; }
  .plug-card.unreachable h4, .plug-status-bad { color: var(--heat); }
  .plug-hint { font-size: .7rem; color: var(--dim); margin-top: .3rem; }
  .plug-hint code { font-size: .68rem; }

  .batch-list { list-style: none; }
  .batch-list li { border-bottom: 1px solid var(--border); }
  .batch-list li:last-child { border-bottom: none; }
  .batch-list a { display: block; padding: .45rem 0; text-decoration: none; }
  .batch-list a:hover .bname { color: var(--accent); }
  .bname { font-size: .85rem; font-weight: 600; }
  .bmeta { font-size: .72rem; color: var(--dim); margin-top: 1px; }
  .bctl { font-size: .72rem; color: var(--dim); margin-top: 1px; }
  .bctl b { color: var(--text); font-weight: 600; }
  .live-tag { color: var(--green); font-size: .68rem; font-weight: 700; margin-left: .3rem; }
  .show-all { margin-top: .4rem; }

  .form-group { margin-bottom: .55rem; }
  .form-group label { display: block; font-size: .72rem; color: var(--dim); margin-bottom: 2px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: .4rem .5rem; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font-size: .85rem; font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 48px; }

  /* --- Toasts --- */
  #toasts { position: fixed; bottom: 1rem; right: 1rem; display: grid; gap: .5rem; z-index: 10; max-width: calc(100vw - 2rem); }
  .toast {
    background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--green);
    padding: .55rem .8rem; border-radius: 6px; font-size: .82rem; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .toast.err { border-left-color: var(--heat); }
</style>
</head>
<body>

<header>
  <h1>Zymoscope</h1>
  <div class="status" title="Live connection to the dashboard server">
    <span class="dot" id="ws-dot"></span><span id="ws-label">connecting…</span>
  </div>
</header>

<div class="layout">
  <section class="devices" id="devices">
    <div class="no-devices card" id="no-devices">Waiting for devices&hellip;</div>
  </section>

  <aside class="sidebar">
    <div class="card">
      <h3>Smart Plugs</h3>
      <div id="plug-section"><div class="small-dim">No plugs configured</div></div>
    </div>

    <div class="card">
      <h3>Batches</h3>
      <ul class="batch-list" id="batch-list"><li class="small-dim">No batches yet</li></ul>
      <button class="btn ghost show-all" id="batch-more" hidden>Show all</button>
    </div>

    <div class="card">
      <h3>Start a Batch</h3>
      <form id="batch-form">
        <div class="form-group">
          <label for="bf-name">Name</label>
          <input id="bf-name" name="name" required placeholder="e.g. Basmati rice koji">
        </div>
        <div class="form-group">
          <label for="device-select">Device</label>
          <select name="device_id" id="device-select" required></select>
        </div>
        <div class="form-group">
          <label for="bf-style">Type</label>
          <input id="bf-style" name="style" placeholder="e.g. A. oryzae, amazake, dahi">
        </div>
        <div class="form-group">
          <label for="bf-notes">Notes</label>
          <textarea id="bf-notes" name="notes" placeholder="Optional"></textarea>
        </div>
        <button type="submit" class="btn">Start batch</button>
      </form>
    </div>
  </aside>
</div>

<div id="toasts" aria-live="polite"></div>

<script>
(function() {
  "use strict";

  const STALE_SEC = 120;         // no telemetry for this long -> offline
  const RANGES = [1, 6, 24, 72, 168, 720, 0];
  // Default chart range: ?range=<hours> (0 = all), else 24 h.
  const DEFAULT_RANGE = (() => {
    const r = Number(new URLSearchParams(location.search).get("range"));
    return RANGES.includes(r) && new URLSearchParams(location.search).has("range") ? r : 24;
  })();
  const SP_MIN = 0, SP_MAX = 60; // matches firmware's accepted range

  const devices = {};            // device_id -> entry
  let batches = [];
  let showAllBatches = false;
  let plugs = [];

  const $ = (id) => document.getElementById(id);
  const devicesEl = $("devices");
  const deviceSelect = $("device-select");

  // ---------------------------------------------------------------- helpers
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function fmt(v, d = 1) { return v == null || isNaN(v) ? "--" : Number(v).toFixed(d); }
  function parseTemp(tc) {
    if (tc == null) return null;
    if (typeof tc === "string") {
      try { tc = JSON.parse(tc); } catch { const n = Number(tc); return isNaN(n) ? null : n; }
    }
    if (Array.isArray(tc)) return tc.length ? Number(tc[0]) : null;
    const n = Number(tc); return isNaN(n) ? null : n;
  }
  function humanAge(sec) {
    if (sec < 60) return sec + "s ago";
    if (sec < 3600) return Math.round(sec / 60) + "m ago";
    if (sec < 86400) return Math.round(sec / 3600) + "h ago";
    return Math.round(sec / 86400) + "d ago";
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec));
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    if (d) return `${d}d ${h}h`;
    if (h) return `${h}h ${m}m`;
    return `${m}m`;
  }
  // SQLite CURRENT_TIMESTAMP strings are UTC without a zone marker.
  function sqlTs(s) { return s ? new Date(s.replace(" ", "T") + "Z") : null; }

  function toast(msg, isErr) {
    const el = document.createElement("div");
    el.className = "toast" + (isErr ? " err" : "");
    el.textContent = msg;
    $("toasts").appendChild(el);
    setTimeout(() => el.remove(), isErr ? 6000 : 3000);
  }
  async function api(url, opts) {
    const res = await fetch(url, opts);
    let body = null;
    try { body = await res.json(); } catch {}
    if (!res.ok || (body && body.error)) throw new Error((body && body.error) || res.statusText);
    return body;
  }
  const postJson = (url, data) => api(url, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data || {}),
  });

  // ---------------------------------------------------------------- chart
  function tickLabel(ms, rangeHours) {
    const d = new Date(ms);
    if (rangeHours > 0 && rangeHours <= 48)
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " +
           d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function makeChart(canvas, entry) {
    return new Chart(canvas, {
      type: "line",
      data: { datasets: [
        // 0: min (invisible lower edge of the band)
        { label: "min", data: [], borderWidth: 0, pointRadius: 0, yAxisID: "y" },
        // 1: max, filled down to dataset 0 -> min/max band
        { label: "range", data: [], borderWidth: 0, pointRadius: 0, fill: "-1",
          backgroundColor: "rgba(224,80,64,0.15)", yAxisID: "y" },
        // 2: average temperature
        { label: "Temperature", data: [], borderColor: "#e05040", borderWidth: 1.6,
          pointRadius: 0, tension: 0.25, spanGaps: false, yAxisID: "y" },
        // 3: target
        { label: "Target", data: [], borderColor: "#40c060", borderWidth: 1.2,
          borderDash: [5, 4], pointRadius: 0, yAxisID: "y" },
        // 4: heater duty (0..1)
        { label: "Heater", data: [], borderColor: "rgba(240,160,32,0.55)", borderWidth: 1,
          pointRadius: 0, stepped: true, fill: "origin",
          backgroundColor: "rgba(240,160,32,0.10)", yAxisID: "y1" },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
        normalized: true,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: true, labels: {
            color: "#888", boxWidth: 12, font: { size: 10 },
            filter: (item) => item.datasetIndex >= 2,
          }},
          tooltip: {
            filter: (item) => {
              if (item.datasetIndex === 0) return false;
              if (item.datasetIndex === 1) {   // skip a zero-width band
                const lo = item.chart.data.datasets[0].data[item.dataIndex];
                return lo && lo.y != null && item.parsed.y - lo.y >= 0.05;
              }
              return true;
            },
            callbacks: {
              title: (items) => items.length ? new Date(items[0].parsed.x).toLocaleString([], {
                month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "",
              label: (item) => {
                const i = item.dataIndex, ds = item.chart.data.datasets;
                switch (item.datasetIndex) {
                  case 1: return ` range ${fmt(ds[0].data[i].y)}–${fmt(item.parsed.y)} °C`;
                  case 2: return ` temp ${fmt(item.parsed.y, 2)} °C`;
                  case 3: return ` target ${fmt(item.parsed.y)} °C`;
                  case 4: return ` heater ${Math.round(item.parsed.y * 100)}% on`;
                }
              },
            },
          },
        },
        scales: {
          x: { type: "linear", grid: { color: "#222" },
               ticks: { color: "#666", maxTicksLimit: 7, font: { size: 9 },
                        callback: (v) => tickLabel(v, entry.rangeHours) } },
          y: { position: "left", grid: { color: "#222" }, grace: "5%",
               ticks: { color: "#e05040", font: { size: 9 }, callback: (v) => v + "°" } },
          // Heater duty (0..1) occupies the bottom quarter of the chart.
          y1: { position: "right", min: 0, max: 4, display: false },
        },
      },
    });
  }

  // Rebuild all datasets from entry.points ([t, avg, min, max, duty, ...]).
  // A null point is inserted wherever the device was off for a while, so
  // the lines break instead of drawing straight across the gap.
  // Target in force at unix time ts, from the logged target changes
  // (falls back to the current target when nothing is logged).
  function targetAt(entry, ts) {
    const h = entry.spHist;
    if (!h.length) return entry.setpoint;
    let v = null;
    for (const [t, sp] of h) { if (t <= ts) v = sp; else break; }
    return v;
  }

  function renderChart(entry) {
    const ds = entry.chart.data.datasets;
    const gap = Math.max(600, 3 * entry.bucket);
    const pts = [];
    for (let i = 0; i < entry.points.length; i++) {
      const p = entry.points[i], prev = entry.points[i - 1];
      if (prev && p[0] - prev[0] > gap) pts.push([prev[0] + entry.bucket, null, null, null, null]);
      pts.push(p);
    }
    const col = (k) => pts.map(p => ({ x: p[0] * 1000, y: p[k] }));
    ds[0].data = col(2);
    ds[1].data = col(3);
    ds[2].data = col(1);
    ds[3].data = pts.map(p => ({ x: p[0] * 1000, y: p[1] == null ? null : targetAt(entry, p[0]) }));
    ds[4].data = col(4);
    // The band only means something once samples are aggregated.
    ds[1].hidden = ds[0].hidden = entry.bucket <= 60;
    const x = entry.chart.options.scales.x;
    if (entry.rangeHours > 0) { x.min = Date.now() - entry.rangeHours * 3600e3; x.max = Date.now(); }
    else { x.min = undefined; x.max = undefined; }
    entry.chart.update("none");
    entry.q("chart-msg").textContent = pts.length ? "" : "No data in this range";
    renderStats(entry);
  }

  function renderStats(entry) {
    const pts = entry.points.filter(p => p[1] != null);
    const el = entry.q("stats");
    if (!pts.length) { el.innerHTML = ""; return; }
    let lo = Infinity, hi = -Infinity, sum = 0, n = 0, dutySum = 0, dutyN = 0;
    for (const p of entry.points) {
      const w = p[7] || 1;
      if (p[1] != null) { lo = Math.min(lo, p[2]); hi = Math.max(hi, p[3]); sum += p[1] * w; n += w; }
      if (p[4] != null) { dutySum += p[4] * w; dutyN += w; }
    }
    const parts = [
      `Min <b>${fmt(lo)}°</b>`, `Avg <b>${fmt(sum / n)}°</b>`, `Max <b>${fmt(hi)}°</b>`,
      `Heater on <b>${dutyN ? Math.round(dutySum / dutyN * 100) : 0}%</b> of the time`,
    ];
    // How much of the range was within ±1 °C of the target at the time
    // (target changes are logged since Nov 2026; older points are skipped).
    let inBand = 0, tot = 0;
    for (const p of pts) {
      const sp = targetAt(entry, p[0]);
      if (sp == null) continue;
      const w = p[7] || 1; tot += w;
      if (Math.abs(p[1] - sp) <= 1) inBand += w;
    }
    if (tot) parts.push(`Within ±1° of target <b>${Math.round(inBand / tot * 100)}%</b>`);
    el.innerHTML = parts.map(x => `<span>${x}</span>`).join("");
  }

  async function fetchSeries(id) {
    const entry = devices[id];
    if (!entry) return;
    const req = ++entry.req;   // ignore responses for ranges no longer selected
    entry.q("chart-msg").textContent = "Loading…";
    try {
      const [s, hist] = await Promise.all([
        api(`/api/series/${encodeURIComponent(id)}?hours=${entry.rangeHours}`),
        api(`/api/setpoints/${encodeURIComponent(id)}?hours=${entry.rangeHours}`).catch(() => null),
      ]);
      if (req !== entry.req) return;
      if (Array.isArray(hist)) entry.spHist = hist;
      entry.points = s.points;
      entry.bucket = s.bucket_s;
      renderChart(entry);
    } catch (e) {
      if (req === entry.req) entry.q("chart-msg").textContent = "Couldn't load history";
    }
  }

  // ---------------------------------------------------------------- device card
  function ensureDevice(id, name) {
    if (devices[id]) {
      if (name) setName(devices[id], name);
      return devices[id];
    }
    $("no-devices").style.display = "none";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="dev-head">
        <div style="min-width:0">
          <div class="dev-name">
            <h2 data-f="name"></h2>
            <button class="icon-btn" data-f="rename" title="Rename">✎</button>
          </div>
          <div class="dev-id" data-f="dev-id">${escapeHtml(id)}</div>
        </div>
        <div class="dev-meta">
          <span class="pill" data-f="pill">—</span>
          <span class="small-dim" data-f="last-seen"></span>
          <span class="small-dim" data-f="fw"></span>
          <span class="oled-ctl">
            <button class="icon-btn" data-f="oled-next" title="Show the next page on the device's screen (main · chart · info)">Screen ›</button>
            <button class="icon-btn pet" data-f="oled-pet" title="Say hi" aria-label="Say hi">🐾</button>
          </span>
        </div>
      </div>
      <div class="banner" data-f="banner"></div>
      <div class="readout">
        <div class="tile temp">
          <div class="lbl">Temperature</div>
          <div class="big"><span data-f="temp">--</span><span class="u">°C</span></div>
          <div class="delta" data-f="delta"></div>
        </div>
        <div class="tile">
          <div class="lbl">Target</div>
          <div class="target-row">
            <button class="step" data-f="sp-down" aria-label="Lower target">−</button>
            <input type="number" data-f="sp" step="0.5" min="${SP_MIN}" max="${SP_MAX}" aria-label="Target temperature">
            <button class="step" data-f="sp-up" aria-label="Raise target">+</button>
            <span class="u">°C</span>
          </div>
          <div style="display:flex;gap:.4rem;margin-top:.35rem">
            <button class="btn" data-f="sp-save" hidden>Set</button>
            <button class="btn ghost" data-f="sp-cancel" hidden>Cancel</button>
          </div>
        </div>
      </div>
      <div class="batch-line" data-f="batch-line"></div>
      <div class="stats" data-f="stats"></div>
      <div class="toolbar">
        <div class="seg" data-f="ranges">
          ${RANGES.map(h => `<button data-range="${h}" class="${h === DEFAULT_RANGE ? "active" : ""}">${
            h === 0 ? "All" : h < 72 ? h + "h" : h / 24 + "d"}</button>`).join("")}
        </div>
        <span class="spacer"></span>
        <a class="tool" data-f="csv" title="Download raw data for this range">CSV</a>
        <button data-f="expand" title="Taller chart">Expand</button>
      </div>
      <div class="chart-wrap" data-f="chart-wrap"><canvas></canvas><div class="chart-msg" data-f="chart-msg"></div></div>
      <div class="small-dim" style="margin-top:.5rem" data-f="ambient"></div>
    `;
    devicesEl.appendChild(card);

    const entry = {
      id, el: card, name: id, points: [], bucket: 30, req: 0,
      rangeHours: DEFAULT_RANGE, setpoint: null, spDirty: false, last: null, lastSeen: null,
      spHist: [],   // [[unix_ts, target], ...] for the chart's target line
      q: (f) => card.querySelector(`[data-f="${f}"]`),
    };
    entry.chart = makeChart(card.querySelector("canvas"), entry);
    devices[id] = entry;
    setName(entry, name || id);
    updateCsvLink(entry);

    // Range selector
    entry.q("ranges").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-range]");
      if (!btn) return;
      entry.rangeHours = Number(btn.dataset.range);
      entry.q("ranges").querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
      updateCsvLink(entry);
      fetchSeries(id);
    });
    entry.q("expand").addEventListener("click", (ev) => {
      const on = entry.q("chart-wrap").classList.toggle("full");
      ev.target.classList.toggle("active", on);
      entry.chart.resize();
    });

    // Device screen (OLED)
    const oled = async (what, msg) => {
      try { await postJson(`/api/cmd/${encodeURIComponent(id)}`, { display: what }); if (msg) toast(msg); }
      catch (e) { toast("Couldn't reach the device: " + e.message, true); }
    };
    entry.q("oled-next").addEventListener("click", () => oled("next"));
    entry.q("oled-pet").addEventListener("click", () => oled("pet", "Look at the screen 👀"));

    // Rename
    entry.q("rename").addEventListener("click", () => startRename(entry));
    entry.q("name").addEventListener("dblclick", () => startRename(entry));

    // Target temperature
    const spInput = entry.q("sp");
    const nudge = (d) => {
      const base = parseFloat(spInput.value);
      const v = Math.min(SP_MAX, Math.max(SP_MIN, (isNaN(base) ? 30 : base) + d));
      spInput.value = v.toFixed(1);
      markSpDirty(entry);
    };
    entry.q("sp-down").addEventListener("click", () => nudge(-0.5));
    entry.q("sp-up").addEventListener("click", () => nudge(+0.5));
    spInput.addEventListener("input", () => markSpDirty(entry));
    spInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveSetpoint(entry);
      if (e.key === "Escape") cancelSetpoint(entry);
    });
    entry.q("sp-save").addEventListener("click", () => saveSetpoint(entry));
    entry.q("sp-cancel").addEventListener("click", () => cancelSetpoint(entry));

    if (!deviceSelect.querySelector(`option[value="${CSS.escape(id)}"]`)) {
      const opt = document.createElement("option");
      opt.value = id;
      deviceSelect.appendChild(opt);
    }
    refreshDeviceOptions();
    renderBatchLine(entry);
    fetchLatest(id);
    fetchSeries(id);
    return entry;
  }

  function setName(entry, name) {
    entry.name = name;
    entry.q("name").textContent = name;
    entry.q("name").title = name;
    entry.q("dev-id").hidden = name === entry.id;   // don't show the MAC twice
    refreshDeviceOptions();
  }
  function refreshDeviceOptions() {
    for (const opt of deviceSelect.options) {
      const e = devices[opt.value];
      if (e) opt.textContent = e.name === e.id ? e.id : `${e.name} (${e.id})`;
    }
  }
  function updateCsvLink(entry) {
    entry.q("csv").href = `/api/export/${encodeURIComponent(entry.id)}.csv?hours=${entry.rangeHours}`;
  }

  function startRename(entry) {
    const h2 = entry.q("name");
    if (h2.style.display === "none") return;
    const input = document.createElement("input");
    input.value = entry.name === entry.id ? "" : entry.name;
    input.placeholder = "e.g. Koji chamber";
    input.maxLength = 40;
    h2.style.display = "none";
    h2.after(input);
    input.focus();
    let done = false;
    const finish = async (save) => {
      if (done) return; done = true;
      input.remove(); h2.style.display = "";
      const name = input.value.trim();
      if (!save || name === entry.name) return;
      try {
        const r = await postJson(`/api/devices/${encodeURIComponent(entry.id)}`, { name });
        setName(entry, r.name);
        toast("Renamed to " + r.name);
      } catch (e) { toast("Rename failed: " + e.message, true); }
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(true));
  }

  // --- setpoint
  function markSpDirty(entry) {
    const v = parseFloat(entry.q("sp").value);
    entry.spDirty = !isNaN(v) && v !== entry.setpoint;
    entry.q("sp-save").hidden = !entry.spDirty;
    entry.q("sp-cancel").hidden = !entry.spDirty;
  }
  function applySetpoint(entry, sp) {
    entry.setpoint = sp == null ? null : Number(sp);
    // Live target change: extend the chart's target history.
    const h = entry.spHist, lastSp = h.length ? h[h.length - 1][1] : null;
    if (entry.setpoint != null && h.length && Math.abs(lastSp - entry.setpoint) >= 0.05) {
      h.push([Date.now() / 1000, entry.setpoint]);
    }
    if (!entry.spDirty) entry.q("sp").value = entry.setpoint == null ? "" : entry.setpoint.toFixed(1);
    markSpDirty(entry);
    renderChart(entry);
    renderStatus(entry);
  }
  function cancelSetpoint(entry) {
    entry.spDirty = false;
    applySetpoint(entry, entry.setpoint);
  }
  async function saveSetpoint(entry) {
    const v = parseFloat(entry.q("sp").value);
    if (isNaN(v) || v < SP_MIN || v > SP_MAX) {
      toast(`Target must be between ${SP_MIN} and ${SP_MAX} °C`, true);
      return;
    }
    try {
      const r = await postJson(`/api/setpoint/${encodeURIComponent(entry.id)}`, { setpoint: v });
      entry.spDirty = false;
      applySetpoint(entry, v);
      if (r.mqtt_error) toast(`Saved ${v.toFixed(1)} °C, but the device didn't get it (MQTT: ${r.mqtt_error})`, true);
      else toast(`Target set to ${v.toFixed(1)} °C`);
    } catch (e) { toast("Couldn't set target: " + e.message, true); }
  }

  // --- live readings
  function applyReading(entry, d, tsMs) {
    entry.last = d;
    entry.lastSeen = tsMs;
    const t = parseTemp(d.temp_c);
    entry.q("temp").textContent = fmt(t);
    const amb = [];
    if (d.humidity != null) amb.push(`Humidity ${fmt(d.humidity)}%`);
    const pres = d.pressure != null ? d.pressure : d.pressure_hpa;
    if (pres != null) amb.push(`Pressure ${fmt(pres)} hPa`);
    if (d.rssi != null) amb.push(`Wi-Fi ${d.rssi} dBm`);
    entry.q("ambient").textContent = amb.join(" · ");
    if (d.fw) entry.q("fw").textContent = "fw " + d.fw;
    renderStatus(entry);
  }

  function renderStatus(entry) {
    const d = entry.last;
    const pill = entry.q("pill"), banner = entry.q("banner");
    if (!d || entry.lastSeen == null) { pill.className = "pill"; pill.textContent = "no data"; return; }
    const ageSec = Math.max(0, Math.round((Date.now() - entry.lastSeen) / 1000));
    const offline = ageSec > STALE_SEC;
    const t = parseTemp(d.temp_c);
    entry.el.classList.toggle("offline", offline);
    entry.q("last-seen").textContent = "updated " + humanAge(ageSec);

    let cls, label, warn = "";
    if (offline) {
      cls = "offline"; label = "Offline";
      warn = `No data for ${fmtDur(ageSec)}. The dashboard switches the heater plug off after a few minutes of silence.`;
    } else if (t == null) {
      cls = "fault"; label = "Probe fault";
      warn = "The temperature probe isn't reading, so the heater is held off. The firmware keeps re-scanning; check the probe wiring if this doesn't clear within a minute.";
    } else if (d.relay1) { cls = "heating"; label = "Heating"; }
    else if (d.relay2) { cls = "cooling"; label = "Cooling"; }
    else { cls = "holding"; label = "Holding"; }
    pill.className = "pill " + cls;
    pill.textContent = label;
    banner.textContent = warn;
    banner.classList.toggle("show", !!warn);

    const delta = entry.q("delta");
    if (t != null && entry.setpoint != null && !offline) {
      const diff = t - entry.setpoint;
      delta.textContent = Math.abs(diff) < 0.25 ? "at target"
        : `${fmt(Math.abs(diff))}° ${diff < 0 ? "below" : "above"} target`;
    } else delta.textContent = "";
  }

  function onTelemetry(id, d) {
    const entry = ensureDevice(id);
    const tsMs = d.timestamp ? d.timestamp * 1000 : Date.now();
    applyReading(entry, d, tsMs);
    // Append to the chart as a raw point (aggregated history + live tail).
    const t = parseTemp(d.temp_c);
    const ts = Math.round(tsMs / 1000);
    const lastPt = entry.points[entry.points.length - 1];
    if (!lastPt || ts > lastPt[0]) {
      entry.points.push([ts, t, t, t, d.relay1 ? 1 : 0, d.humidity, d.pressure, 1]);
      if (entry.rangeHours > 0) {
        const cutoff = Date.now() / 1000 - entry.rangeHours * 3600;
        while (entry.points.length && entry.points[0][0] < cutoff) entry.points.shift();
      }
      renderChart(entry);
    }
  }

  async function fetchLatest(id) {
    try {
      const row = await api(`/api/telemetry/${encodeURIComponent(id)}/latest`);
      const entry = devices[id];
      if (entry && row && row.timestamp && entry.lastSeen == null) applyReading(entry, row, row.timestamp * 1000);
    } catch {}
  }

  // ---------------------------------------------------------------- batches
  function renderBatchLine(entry) {
    const el = entry.q("batch-line");
    const active = batches.find(b => !b.ended_at && b.device_id === entry.id);
    if (!active) { el.classList.remove("show"); return; }
    const started = sqlTs(active.started_at);
    el.innerHTML = `<span>Batch: <a href="/batches/${Number(active.id)}">${escapeHtml(active.name.trim())}</a>
      <span class="small-dim">· running ${fmtDur((Date.now() - started) / 1000)}</span></span>
      <button class="btn ghost" data-end="${Number(active.id)}">End batch</button>`;
    el.classList.add("show");
    el.querySelector("[data-end]").addEventListener("click", async () => {
      if (!confirm(`End batch "${active.name.trim()}"?`)) return;
      try {
        await postJson(`/api/batches/${Number(active.id)}/end`);
        toast("Batch ended");
        loadBatches();
      } catch (e) { toast("Couldn't end batch: " + e.message, true); }
    });
  }

  // One-line control summary from the stats saved when a batch ends.
  function batchCtlLine(raw) {
    let st;
    try { st = raw ? JSON.parse(raw) : null; } catch { st = null; }
    if (!st || st.within_05_pct == null) return "";
    const off = st.mean_offset_c, band = st.band90_c || [0, 0];
    const half = Math.max(Math.abs(band[0]), Math.abs(band[1]));
    return `<div class="bctl" title="Average offset · 90% spread · time within ±0.5 °C of target">` +
      `<b>${off >= 0 ? "+" : "−"}${Math.abs(off).toFixed(2)}°</b> avg · ` +
      `±${half.toFixed(2)}° · <b>${Math.round(st.within_05_pct)}%</b> in ±0.5°</div>`;
  }

  function renderBatchList() {
    const list = $("batch-list");
    if (!batches.length) { list.innerHTML = '<li class="small-dim">No batches yet</li>'; $("batch-more").hidden = true; return; }
    const shown = showAllBatches ? batches : batches.slice(0, 6);
    list.innerHTML = shown.map(b => {
      const s = sqlTs(b.started_at), e = sqlTs(b.ended_at);
      const when = s ? s.toLocaleDateString([], { month: "short", day: "numeric", year: s.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined }) : "";
      const dur = s ? fmtDur(((e || new Date()) - s) / 1000) : "";
      const meta = [when, dur, b.style && b.style.trim()].filter(Boolean).map(escapeHtml).join(" · ");
      return `<li><a href="/batches/${Number(b.id)}">
        <div class="bname">${escapeHtml(b.name.trim())}${b.ended_at ? "" : '<span class="live-tag">● LIVE</span>'}</div>
        <div class="bmeta">${meta}</div>${batchCtlLine(b.stats)}</a></li>`;
    }).join("");
    const more = $("batch-more");
    more.hidden = batches.length <= 6;
    more.textContent = showAllBatches ? "Show fewer" : `Show all ${batches.length}`;
  }
  $("batch-more").addEventListener("click", () => { showAllBatches = !showAllBatches; renderBatchList(); });

  async function loadBatches() {
    try { batches = await api("/api/batches"); } catch { return; }
    renderBatchList();
    for (const id of Object.keys(devices)) renderBatchLine(devices[id]);
  }

  $("batch-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const body = {};
    for (const [k, v] of new FormData(form).entries()) if (v.trim()) body[k] = v.trim();
    const running = batches.find(b => !b.ended_at && b.device_id === body.device_id);
    if (running && !confirm(`"${running.name.trim()}" is still running on this device. Start another anyway?`)) return;
    try {
      await postJson("/api/batches", body);
      form.reset();
      if (deviceSelect.options.length) deviceSelect.selectedIndex = 0;
      toast(`Started "${body.name}"`);
      loadBatches();
    } catch (err) { toast("Couldn't start batch: " + err.message, true); }
  });

  // ---------------------------------------------------------------- plugs
  async function loadPlugs() {
    try { plugs = await api("/api/plugs"); } catch { return; }
    const section = $("plug-section");
    if (!plugs.length) return;
    section.innerHTML = "";
    for (const p of plugs) {
      const div = document.createElement("div");
      div.className = "plug-card";
      const title = escapeHtml(p.alias || p.host);
      if (p.error) {
        div.classList.add("unreachable");
        div.innerHTML = `<div class="plug-title"><h4>${title}</h4><span class="plug-status-bad">unreachable</span></div>
          <div class="plug-hint">Configured at <code>${escapeHtml(p.host)}</code>.
          ${p.alias ? "Will retry discovery by name on the next poll." : "Set KASA_*_ALIAS to enable auto-rediscovery."}</div>`;
        section.appendChild(div);
        continue;
      }
      const power = p.power_w != null
        ? `<div class="plug-row"><span class="lbl">Power</span><span class="val">${fmt(p.power_w)} W</span></div>
           <div class="plug-row"><span class="lbl">Voltage</span><span class="val">${fmt(p.voltage_v)} V</span></div>` : "";
      const drift = (p.live_host && p.live_host !== p.host)
        ? `<div class="plug-hint">Found by name at <code>${escapeHtml(p.live_host)}</code> (configured: <code>${escapeHtml(p.host)}</code>).</div>` : "";
      div.innerHTML = `<div class="plug-title"><h4>${title}</h4>
          <button class="plug-toggle ${p.is_on ? "on" : ""}" title="Manual override — the controller will switch it again on its next change">${p.is_on ? "ON" : "OFF"}</button></div>
        ${power}${drift}`;
      div.querySelector(".plug-toggle").addEventListener("click", async () => {
        const action = p.is_on ? "off" : "on";
        try {
          const r = await api(`/api/plugs/${encodeURIComponent(p.host)}/${action}`, { method: "POST" });
          if (r.status !== "ok") throw new Error("plug didn't respond");
          toast(`${p.alias || p.host} switched ${action}`);
        } catch (e) { toast("Plug: " + e.message, true); }
        setTimeout(loadPlugs, 500);
      });
      section.appendChild(div);
    }
  }

  // ---------------------------------------------------------------- state + websocket
  async function loadState() {
    try {
      const state = await api("/api/state");
      for (const [id, st] of Object.entries(state)) if (devices[id]) applySetpoint(devices[id], st.setpoint);
      return state;
    } catch { return {}; }
  }

  let ws;
  function connectWs() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => { $("ws-dot").classList.add("ok"); $("ws-label").textContent = "live"; };
    ws.onclose = () => {
      $("ws-dot").classList.remove("ok"); $("ws-label").textContent = "reconnecting…";
      setTimeout(connectWs, 3000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === "snapshot") {
        for (const [id, d] of Object.entries(msg.devices || {})) {
          const entry = ensureDevice(id);
          applyReading(entry, d, d.timestamp ? d.timestamp * 1000 : Date.now());
        }
        for (const [id, st] of Object.entries(msg.state || {})) if (devices[id]) applySetpoint(devices[id], st.setpoint);
      } else if (msg.type === "state") {
        if (msg.device_id && devices[msg.device_id] && msg.setpoint != null) applySetpoint(devices[msg.device_id], msg.setpoint);
      } else if (msg.device_id) {
        onTelemetry(msg.device_id, msg);
      }
    };
  }

  async function init() {
    try {
      const list = await api("/api/devices");
      for (const d of list) ensureDevice(d.device_id, d.name);
    } catch {}
    await Promise.all([loadState(), loadBatches()]);
    connectWs();
    loadPlugs();
  }
  init();

  setInterval(loadPlugs, 30000);
  setInterval(loadBatches, 60000);
  // Keep "updated Xs ago", offline detection and the time axis moving.
  setInterval(() => { for (const id of Object.keys(devices)) renderStatus(devices[id]); }, 15000);
  setInterval(() => {
    for (const id of Object.keys(devices)) {
      const e = devices[id];
      if (e.rangeHours > 0) renderChart(e);
    }
  }, 60000);
})();
</script>
</body>
</html>
